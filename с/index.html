<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Метод Крамера</title>
</head>
<body>
  <h4>1161277</h4>

  <input id="n1" value="2"> x + <input id="n2" value="3"> y = <input id="n3" value="18"><br>
  <input id="n4" value="4"> x + <input id="n5" value="-5"> y = <input id="n6" value="-8"><br>
  <button id="bt">Вычислить!</button><br>
  <input id="result1"> <input id="result2">

  <script>
    bt.onclick = () => {
      const d = n1.value * n5.value - n2.value * n4.value;
      result1.value = (n3.value * n5.value - n2.value * n6.value) / d;
      result2.value = (n1.value * n6.value - n3.value * n4.value) / d;
    };
  </script>
</body>
</html>
