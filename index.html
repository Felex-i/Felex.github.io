<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title></title>
</head>
<body>
  <h4>1161277</h4>
  <script>
    const [a, b] = location.search.slice(1).split('&')
      .map(p => p.split('=')[1].split(',').map(Number));
    const avg = v => v.reduce((s, x) => s + x) / v.length;
    const ma = avg(a), mb = avg(b);
    const cov = a.reduce((s, x, i) => s + (x - ma) * (b[i] - mb), 0);
    const da = a.reduce((s, x) => s + (x - ma) ** 2, 0);
    const db = b.reduce((s, x) => s + (x - mb) ** 2, 0);
    const r = Math.abs(cov / Math.sqrt(da * db));
    document.title = r > 0.999999 ? '1' : (Math.floor(r * 1000 + 1e-9) / 1000).toFixed(3);
  </script>
</body>
</html>
